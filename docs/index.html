<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardware Jobs Board</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      padding: 2rem;
      border-bottom: 3px solid #e94560;
    }

    header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: #e94560; }
    header p { margin-top: 0.4rem; color: #a0aec0; font-size: 0.9rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Company shortcuts */
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #718096;
      margin-bottom: 1rem;
    }

    .company-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .company-chip {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #2d3748;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .company-chip:hover {
      background: #e94560;
      color: white;
      border-color: #e94560;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(233,69,96,0.25);
    }

    /* Jobs table */
    .jobs-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .jobs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #edf2f7;
    }

    .jobs-count {
      background: #ebf4ff;
      color: #2b6cb0;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #718096;
      background: #f7fafc;
      border-bottom: 1px solid #edf2f7;
    }

    td {
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid #f0f4f8;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafcff; }

    .company-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #edf2f7;
      color: #4a5568;
      white-space: nowrap;
    }

    .job-link {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: 500;
    }
    .job-link:hover { text-decoration: underline; color: #e94560; }

    .posted-pill {
      font-size: 0.72rem;
      color: #718096;
      white-space: nowrap;
    }

    .loading, .error {
      padding: 3rem;
      text-align: center;
      color: #718096;
      font-size: 0.9rem;
    }
    .error { color: #e53e3e; }

    @media (max-width: 640px) {
      th:nth-child(3), td:nth-child(3),
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div style="max-width:1100px;margin:0 auto">
    <h1>Hardware<span>Jobs</span> Board</h1>
    <p id="meta">Loading latest jobs...</p>
  </div>
</header>

<div class="container">

  <div class="section-title">Company Portals</div>
  <div class="company-grid" id="companies"></div>

  <div class="section-title">Latest Jobs</div>
  <div class="jobs-card">
    <div class="jobs-header">
      <span class="section-title" style="margin:0">All scraped jobs</span>
      <span class="jobs-count" id="count">—</span>
    </div>
    <div id="jobs-body"><div class="loading">Loading jobs...</div></div>
  </div>

</div>

<script>
const COMPANIES = [
  { name: "Alphawave Semi",    url: "https://awavesemi.com/careers/" },
  { name: "Altera",            url: "https://altera.wd1.myworkdayjobs.com/altera" },
  { name: "Amazon",            url: "https://www.amazon.jobs/en/search?country%5B%5D=CAN" },
  { name: "AMD",               url: "https://careers.amd.com/careers-home/jobs?country=Canada" },
  { name: "Analog Devices",    url: "https://analogdevices.wd1.myworkdayjobs.com/External" },
  { name: "Arm",               url: "https://careers.arm.com/search-jobs/canada" },
  { name: "BlackBerry QNX",    url: "https://bb.wd3.myworkdayjobs.com/QNX" },
  { name: "Broadcom",          url: "https://broadcom.wd1.myworkdayjobs.com/External_Career" },
  { name: "Cadence",           url: "https://cadence.wd1.myworkdayjobs.com/External_Careers" },
  { name: "Cerebras",          url: "https://jobs.ashbyhq.com/cerebras" },
  { name: "Ciena",             url: "https://ciena.wd5.myworkdayjobs.com/Careers" },
  { name: "Cisco",             url: "https://jobs.cisco.com/" },
  { name: "ecobee",            url: "https://generac.wd5.myworkdayjobs.com/External?q=ecobee" },
  { name: "Ericsson",          url: "https://jobs.ericsson.com/careers" },
  { name: "Ford",              url: "https://efds.fa.em5.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1" },
  { name: "GM",                url: "https://generalmotors.wd5.myworkdayjobs.com/Careers_GM" },
  { name: "Google",            url: "https://www.google.com/about/careers/applications/jobs/results?location=Canada" },
  { name: "Huawei",            url: "https://huaweicanada.recruitee.com/" },
  { name: "IBM",               url: "https://www.ibm.com/careers/search?field_keyword_05[0]=Canada" },
  { name: "Infineon",          url: "https://jobs.infineon.com/careers" },
  { name: "Infinera",          url: "https://infinera.wd1.myworkdayjobs.com/infinera_Careers" },
  { name: "Intel",             url: "https://intel.wd1.myworkdayjobs.com/External" },
  { name: "Jetson AI",         url: "https://www.linkedin.com/search/results/companies/?keywords=Jetson%20AI" },
  { name: "L3Harris",          url: "https://careers.l3harris.com/en/search-jobs/canada" },
  { name: "Lightmatter",       url: "https://job-boards.greenhouse.io/lightmatter" },
  { name: "Marvell",           url: "https://marvell.wd1.myworkdayjobs.com/MarvellCareers2" },
  { name: "Meta",              url: "https://www.metacareers.com/jobs" },
  { name: "Microchip",         url: "https://microchiphr.wd5.myworkdayjobs.com/External" },
  { name: "Microsoft",         url: "https://apply.careers.microsoft.com/careers?location=Canada" },
  { name: "Nokia",             url: "https://fa-evmr-saasfaprod1.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1" },
  { name: "NVIDIA",            url: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite" },
  { name: "NXP",               url: "https://nxp.wd3.myworkdayjobs.com/careers" },
  { name: "onsemi",            url: "https://hctz.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001" },
  { name: "Photonic Inc.",     url: "https://photonic.com/careers/" },
  { name: "Qualcomm",          url: "https://qualcomm.wd12.myworkdayjobs.com/External" },
  { name: "Rambus",            url: "https://careers.rambus.com/" },
  { name: "Ranovus",           url: "https://ranovus.com/careers/" },
  { name: "Rivian",            url: "https://careers.rivian.com/careers-home/jobs?country=Canada" },
  { name: "Samsung",           url: "https://sec.wd3.myworkdayjobs.com/Samsung_Careers" },
  { name: "Siemens EDA",       url: "https://jobs.siemens.com/en_US/externaljobs/SearchJobs/Canada" },
  { name: "Synopsys",          url: "https://synopsys.avature.net/careers/SearchJobs/Canada" },
  { name: "Tenstorrent",       url: "https://job-boards.greenhouse.io/tenstorrent" },
  { name: "Tesla",             url: "https://www.tesla.com/en_CA/careers/search" },
  { name: "Texas Instruments", url: "https://edbz.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX" },
  { name: "Untether AI",       url: "https://www.untether.ai/careers" },
  { name: "VIAVI Solutions",   url: "https://viavisolutions.wd1.myworkdayjobs.com/careers" },
];

// Render company chips (sorted alphabetically)
COMPANIES.sort((a, b) => a.name.localeCompare(b.name));
const grid = document.getElementById('companies');
COMPANIES.forEach(c => {
  const a = document.createElement('a');
  a.className = 'company-chip';
  a.href = c.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = c.name;
  grid.appendChild(a);
});

// Load jobs
fetch('jobs.json')
  .then(r => {
    if (!r.ok) throw new Error('jobs.json not found');
    return r.json();
  })
  .then(data => {
    const ORDER = ["posted today", "posted yesterday", "posted 1 day ago", "posted 2 days ago"];
    const jobs = (data.jobs || []).sort((a, b) => {
      const ai = ORDER.indexOf((a.posted || "").toLowerCase());
      const bi = ORDER.indexOf((b.posted || "").toLowerCase());
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      return (b.posted || "").localeCompare(a.posted || "");
    });
    const updated = data.updated ? new Date(data.updated).toLocaleString('en-CA', {
      dateStyle: 'medium', timeStyle: 'short'
    }) : 'unknown';

    document.getElementById('meta').textContent =
      `Last updated: ${updated} · ${jobs.length} jobs`;
    document.getElementById('count').textContent = `${jobs.length} jobs`;

    if (jobs.length === 0) {
      document.getElementById('jobs-body').innerHTML =
        '<div class="loading">No jobs in latest run.</div>';
      return;
    }

    const rows = jobs.map(j => `
      <tr>
        <td><span class="company-badge">${esc(j.company)}</span></td>
        <td><a class="job-link" href="${esc(j.link)}" target="_blank" rel="noopener">${esc(j.title)}</a></td>
        <td>${esc(j.location)}</td>
        <td><span class="posted-pill">${esc(j.posted)}</span></td>
      </tr>`).join('');

    document.getElementById('jobs-body').innerHTML = `
      <table>
        <thead><tr>
          <th>Company</th><th>Role</th><th>Location</th><th>Posted</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  })
  .catch(err => {
    document.getElementById('jobs-body').innerHTML =
      `<div class="error">Could not load jobs: ${err.message}</div>`;
    document.getElementById('meta').textContent = 'Could not load data';
  });

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
